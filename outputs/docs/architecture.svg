<rect x="345" y="385" width="310" height="95" rx="9" fill="#dbeee7" stroke="#11665c"/><text x="363" y="415" font-size="18" font-weight="700">Bounded read workflow</text><text x="363" y="440" font-size="14">Four tools / strict schemas / read only</text><text x="363" y="462" font-size="14">Two proposal attempts / audit + budget</text>
