<rect x="795" y="435" width="340" height="90" rx="9" fill="white" stroke="#bdcfcb"/><text x="813" y="465" font-size="18" font-weight="700">Validated recommendation</text><text x="813" y="490" font-size="14">Offline template; live model unmeasured</text><text x="813" y="512" font-size="14">Immutable recipient / text / evidence hash</text>
<rect x="795" y="575" width="340" height="90" rx="9" fill="#dbeee7" stroke="#11665c"/><text x="813" y="605" font-size="18" font-weight="700">Explicit human decision</text><text x="813" y="630" font-size="14">Assigned reviewer / exact version / expiry</text><text x="813" y="652" font-size="14">No web send endpoint or delivery adapter</text>
