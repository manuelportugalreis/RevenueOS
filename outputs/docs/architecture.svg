<rect x="795" y="85" width="340" height="95" rx="9" fill="#142f36"/><text x="813" y="115" font-size="18" font-weight="700" fill="white">PostgreSQL</text><text x="813" y="140" font-size="14" fill="#dcebe8">CRM snapshots / knowledge / run ledger</text><text x="813" y="162" font-size="14" fill="#dcebe8">Approvals / sessions / redacted audit</text>
