name: RevenueOS offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: revenueos
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: revenueos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U revenueos -d revenueos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://revenueos:ci-local-only@127.0.0.1:5432/revenueos_test
      REVENUEOS_TEST_ALLOW_RESET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m ruff check src migrations tests
      - run: python -m ruff format --check src migrations tests
      - run: python -m mypy src
      - run: python -m pytest --require-db --junitxml=work/test-results.xml
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: npm run build --prefix frontend
      - name: Build the presentation container
        run: docker build --tag revenueos:ci .
      - run: cd frontend && npx playwright install --with-deps chromium
      - name: Build the public replay
        run: npm run build:showcase --prefix frontend
      - name: Verify the public replay without backend requests
        run: npm run test:showcase --prefix frontend
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: frontend/public-dist
      - name: Browser API and PostgreSQL flow
        env:
          PGPASSWORD: ci-local-only
          DATABASE_URL: postgresql+psycopg://revenueos:ci-local-only@127.0.0.1:5432/revenueos_web_demo
          REVENUEOS_RUNTIME_DATABASE_URL: postgresql+psycopg://revenueos_runtime_login_test:synthetic-runtime-fixture-only@127.0.0.1:5432/revenueos_web_demo
          REVENUEOS_DEMO_PASSWORD: Synthetic-browser-fixture-2026!
        run: |
          createdb -h 127.0.0.1 -U revenueos revenueos_web_demo
          python -m alembic upgrade head
          python -m revenueos.operations provision-runtime
          psql -h 127.0.0.1 -U revenueos -d revenueos_web_demo -v ON_ERROR_STOP=1 -c 'GRANT revenueos_runtime TO revenueos_runtime_login_test'
          python scripts/serve_dashboard_demo.py > work/dashboard.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8000/health/ready; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8000/health/ready
          npm run test:e2e --prefix frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            work/test-results.xml
            outputs/dashboard-browser-tests.xml
            outputs/RevenueOS-Dashboard-*.png
            frontend/test-results/
            outputs/public-demo-tests.xml
            outputs/RevenueOS-Public-Demo-Mobile.png

  deploy-public-demo:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
