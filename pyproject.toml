[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "revenueos"
version = "0.1.0"
description = "RevenueOS CRM data foundation and evaluated offline intelligence"
requires-python = ">=3.12"
dependencies = ["SQLAlchemy>=2.0,<2.1", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "pydantic>=2.10,<3", "fastapi>=0.143,<0.144", "uvicorn>=0.54,<0.55", "authlib>=1.9.1,<2", "itsdangerous>=2.2,<3", "httpx2>=2.13,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.15,<2"]

[project.scripts]
revenueos = "revenueos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
revenueos = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires TEST_DATABASE_URL pointing at an empty disposable PostgreSQL database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

